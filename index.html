                                            {editForm.address && (
                                              <button onClick={() => setEditForm({...editForm, address: ''})} className="absolute left-2 top-2.5 text-gray-400 hover:text-red-500 transition-colors" title="נקה">
                                                <CloseIcon className="w-4 h-4" />
                                              </button>
                                            )}
                                          </div>
                                        </div>
                                      </div>
                                    </div>

                                    <div className="bg-gray-50 p-3 rounded-lg border border-gray-200">
                                      <label className="block text-xs font-bold text-gray-600 mb-2">תמונת הארון (העלאה מהמכשיר)</label>
                                      {editForm.imageUrl ? (
                                        <div className="relative inline-block cursor-pointer" onClick={() => setFullScreenImage(editForm.imageUrl)}>
                                          <img src={editForm.imageUrl} className="h-24 w-auto rounded-lg border border-gray-300 shadow-sm object-cover hover:opacity-90 transition-opacity" alt="תצוגה מקדימה" />
                                          <div className="absolute bottom-1 left-1 bg-black bg-opacity-50 rounded px-1.5 py-0.5 text-white text-[9px] pointer-events-none">לחץ להגדלה</div>
                                          <button onClick={(e) => { e.stopPropagation(); setEditForm({...editForm, imageUrl: ''}); }} className="absolute -top-2 -right-2 bg-red-500 text-white rounded-full p-1.5 shadow-md hover:bg-red-600 transition-colors" title="הסר תמונה">
                                            <CloseIcon className="w-3 h-3" />
                                          </button>
                                        </div>
                                      ) : (
                                        <div>
                                          <input type="file" accept="image/*" id="edit-image-upload" className="hidden" onChange={(e) => handleImageUpload(e, false)} />
                                          <label htmlFor="edit-image-upload" className="cursor-pointer bg-white text-blue-700 hover:bg-blue-50 px-4 py-2.5 rounded-lg text-sm font-bold border border-blue-300 transition-colors flex items-center justify-center gap-2 w-full shadow-sm">
                                            {isUploadingImg ? <LoaderIcon className="w-5 h-5 animate-spin" /> : <UploadIcon className="w-5 h-5" />}
                                            {isUploadingImg ? 'מעבד תמונה...' : 'בחר תמונה או פתח מצלמה 📸'}
                                          </label>
                                          <div className="mt-3">
                                            <input type="text" className="w-full border border-gray-300 rounded-lg p-2 text-xs focus:ring-2 focus:ring-blue-500 ltr-input bg-white text-left" value={editForm.imageUrl} onChange={(e) => setEditForm({...editForm, imageUrl: e.target.value})} placeholder="או הדבק קישור ישיר לתמונה (URL)" dir="ltr" />
                                          </div>
                                        </div>
                                      )}
                                    </div>

                                    <div className="bg-gray-50 p-3 rounded-lg border border-gray-200 mt-3">
                                      <label className="block text-xs font-bold text-gray-600 mb-2">מיקום וניווט (Waze)</label>
                                      <div className="flex flex-col gap-2">
                                        <button onClick={() => handleGetLocation(false)} className="bg-white text-green-700 hover:bg-green-50 px-3 py-2.5 rounded-lg text-sm font-bold border border-green-300 transition-colors flex items-center justify-center gap-2 w-full shadow-sm">
                                          <MapPinIcon className="w-5 h-5" /> דגום מיקום נוכחי עכשיו (GPS) 📍
                                        </button>
                                        <div className="relative">
                                          <input type="text" className="w-full border border-gray-300 rounded-lg p-2.5 text-xs focus:ring-2 focus:ring-blue-500 focus:border-blue-500 ltr-input bg-white text-left" value={editForm.wazeLink} onChange={(e) => setEditForm({...editForm, wazeLink: e.target.value})} placeholder="...או הדבק כאן קישור ווייז ידנית" dir="ltr" />
                                        </div>
                                        {gpsStatus && <p className="text-xs text-green-600 font-medium mt-1">{gpsStatus}</p>}
                                      </div>
                                    </div>

                                    <div className="grid grid-cols-2 gap-3">
                                      <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">תאריך התקנה</label>
                                        <input type="date" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white" value={editForm.installationDate} onChange={(e) => handleInstallationDateChange(e, false)} />
                                      </div>
                                      <div>
                                        <label className="block text-xs font-bold text-gray-600 mb-1">סיום אחריות</label>
                                        <input type="date" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white" value={editForm.warrantyEndDate} onChange={(e) => setEditForm({...editForm, warrantyEndDate: e.target.value})} />
                                      </div>
                                    </div>
                                    <div>
                                      <label className="block text-xs font-bold text-gray-600 mb-1">תיאור ומיקום מדויק</label>
                                      <textarea rows="3" className="w-full border border-gray-300 rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-blue-500 focus:border-blue-500 bg-white resize-none" value={editForm.description} onChange={(e) => setEditForm({...editForm, description: e.target.value})} placeholder="לדוגמה: קומה -1 ליד המעליות..." />
                                    </div>
                                  </div>
                                ) : (
                                  <div className="space-y-4">
                                    <div className="flex items-start gap-3 bg-gray-50 p-3 rounded-lg border border-gray-100">
                                      <InfoIcon className="h-5 w-5 text-gray-400 mt-0.5 flex-shrink-0" />
                                      <div>
                                        <span className="block text-xs font-bold text-gray-500 mb-0.5">תיאור ומיקום באזור</span>
                                        <span className="text-sm font-medium text-gray-800 leading-relaxed">{activeCabinet?.description || 'לא הוזן תיאור'}</span>
                                      </div>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3">
                                      <div className="flex items-start gap-2 bg-white p-2 border border-gray-100 rounded-lg">
                                        <CalendarIcon className="h-4 w-4 text-gray-400 mt-0.5 flex-shrink-0" />
                                        <div>
                                          <span className="block text-[10px] font-bold text-gray-500 uppercase">תאריך התקנה</span>
                                          <span className="text-sm font-bold text-gray-900">{activeCabinet?.installationDate || ''}</span>
                                        </div>
                                      </div>

                                      <div className={`flex items-start gap-2 p-2 border rounded-lg ${activeCabinet?.warrantyEndDate && new Date() > new Date(activeCabinet.warrantyEndDate) ? 'bg-red-50 border-red-100' : 'bg-white border-gray-100'}`}>
                                        <ShieldAlertIcon className={`h-4 w-4 mt-0.5 flex-shrink-0 ${activeCabinet?.warrantyEndDate && new Date() > new Date(activeCabinet.warrantyEndDate) ? 'text-red-500' : 'text-gray-400'}`} />
                                        <div>
                                          <span className="block text-[10px] font-bold text-gray-500 uppercase">תוקף אחריות</span>
                                          <span className={`text-sm font-bold ${activeCabinet?.warrantyEndDate && new Date() > new Date(activeCabinet.warrantyEndDate) ? 'text-red-700' : 'text-gray-900'}`}>
                                            {activeCabinet?.warrantyEndDate || 'לא מוגדר'}
                                            {activeCabinet?.warrantyEndDate && new Date() > new Date(activeCabinet.warrantyEndDate) && <span className="block text-[10px] text-red-500">(פג תוקף)</span>}
                                          </span>
                                        </div>
                                      </div>
                                    </div>
                                  </div>
                                )}
                              </div>
                            </div>

                          </div>
                        </div>

                        <div className="w-full h-px bg-gradient-to-r from-transparent via-gray-300 to-transparent my-8 opacity-50"></div>

                        <div>
                          <div className="flex items-center justify-between mb-5 px-1">
                            <h4 className="text-base sm:text-lg font-bold text-gray-800 flex items-center gap-2">
                              <ClipboardListIcon className="w-5 h-5 text-purple-600"/> דיווחי טכנאי והיסטוריה
                            </h4>
                            <span className="text-xs sm:text-sm bg-purple-100 text-purple-800 py-1 px-3 rounded-full font-bold border border-purple-200 shadow-sm">{activeCabinet?.notes?.length || 0} רשומות</span>
                          </div>

                          <div className="mb-6 bg-gradient-to-br from-purple-50 to-white p-4 sm:p-5 rounded-xl border border-purple-200 shadow-md">
                            <label className="block text-sm sm:text-base font-black text-purple-900 mb-4 flex items-center gap-2">
                              <ActivityIcon className="w-5 h-5" /> הוסף דיווח או תקלה חדשה
                            </label>
                            <div className="flex flex-col gap-4">
                              <div className="w-full sm:w-1/3">
                                <label className="block text-xs font-bold text-purple-800 mb-1.5">תאריך ביצוע</label>
                                <input
                                  type="date"
                                  className="border border-purple-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm py-2.5 px-3 bg-white w-full text-purple-900 font-bold"
                                  value={newNoteDate}
                                  onChange={(e) => setNewNoteDate(e.target.value)}
                                />
                              </div>
                              <div className="flex flex-col sm:flex-row gap-3">
                                <div className="relative flex-1">
                                  <textarea
                                    rows="3"
                                    className="block w-full border border-purple-200 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-purple-500 focus:border-purple-500 text-sm py-3 pr-3 resize-none bg-white font-medium"
                                    placeholder="תאר בפירוט את מה שבוצע בארון, איזה ציוד הוחלף או מהות התקלה..."
                                    value={newNote}
                                    onChange={(e) => setNewNote(e.target.value)}
                                  ></textarea>
                                </div>
                                <button onClick={handleAddNote} className="inline-flex items-center justify-center px-6 py-3 border border-transparent text-sm sm:text-base font-black rounded-lg shadow-md text-white bg-purple-600 hover:bg-purple-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-purple-500 h-auto whitespace-nowrap self-end sm:self-stretch transition-transform active:scale-95 w-full sm:w-auto">
                                  <SaveIcon className="h-5 w-5 ml-2" /> שמור דיווח
                                </button>
                              </div>
                            </div>
                          </div>

                          <div className="space-y-3">
                            {activeCabinet?.notes && activeCabinet.notes.length > 0 ? (
                              activeCabinet.notes.map((note, index) => (
                                <div key={index} className="bg-white p-4 rounded-xl border border-gray-200 shadow-sm flex gap-3 sm:gap-4 items-start group relative hover:border-purple-300 transition-colors">
                                  <div className="bg-purple-50 border border-purple-100 rounded-full p-2.5 sm:p-3 flex-shrink-0 mt-0.5">
                                    <WrenchIcon className="h-4 w-4 sm:h-5 sm:w-5 text-purple-700" />
                                  </div>
                                  <div className="flex-1 min-w-0">
                                    <div className="flex flex-wrap items-center justify-between gap-2 mb-2 border-b border-gray-50 pb-2">
                                      <span className="text-sm font-black text-gray-900">{note.date}</span>
                                      <span className="text-[11px] sm:text-xs bg-gray-100 text-gray-700 border border-gray-200 px-2 py-1 rounded-md flex items-center gap-1 font-bold">
                                        <UserIcon className="w-3 h-3" /> פורסם ע"י: {note.author || 'מערכת'}
                                      </span>
                                    </div>
                                    <p className="text-sm sm:text-base text-gray-800 leading-relaxed whitespace-pre-wrap break-words font-medium">{note.text}</p>
                                  </div>
                                  <button onClick={() => handleDeleteNote(index)} className="text-gray-400 hover:text-red-600 sm:opacity-0 group-hover:opacity-100 transition-opacity absolute left-2 top-2 p-1.5 bg-white hover:bg-red-50 rounded-lg border border-transparent hover:border-red-200 shadow-sm sm:shadow-none" title="מחק רישום">
                                    <TrashIcon className="h-4 w-4" />
                                  </button>
                                </div>
                              ))
                            ) : (
                              <div className="text-center py-10 bg-gray-50 rounded-xl border-2 border-dashed border-gray-300 flex flex-col items-center justify-center">
                                <ActivityIcon className="w-10 h-10 text-gray-300 mb-2" />
                                <p className="text-sm font-bold text-gray-500">לא תועדו טיפולים לארון זה.</p>
                                <p className="text-xs text-gray-400 mt-1">השתמש בטופס למעלה כדי להוסיף את הטיפול הראשון.</p>
                              </div>
                            )}
                          </div>
                        </div>

                      </div>
                      
                      <div className="bg-gray-100 px-4 py-3 sm:px-6 sm:py-4 border-t border-gray-200 flex flex-wrap justify-between items-center gap-3 sticky bottom-0 z-10 rounded-b-2xl shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                        {isEditingInfo ? (
                            <>
                                <button type="button" className="text-gray-600 font-bold px-4 py-2 hover:bg-gray-200 rounded-lg order-2 sm:order-1 transition-colors" onClick={() => setIsEditingInfo(false)}>ביטול עריכה</button>
                                <button type="button" className="bg-green-600 hover:bg-green-700 text-white font-bold py-2.5 px-8 rounded-lg shadow-md transition-colors order-1 sm:order-2 flex items-center justify-center gap-2 flex-1 sm:flex-none" onClick={handleSaveInfo}>
                                    <SaveIcon className="w-5 h-5" /> שמור שינויים
                                </button>
                            </>
                        ) : (
                            <>
                                <div className="flex gap-2 w-full sm:w-auto order-2 sm:order-1">
                                    <button type="button" onClick={() => setCabinetToDelete(activeCabinet.id)} className="flex-1 sm:flex-none bg-red-100 text-red-700 hover:bg-red-200 font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                                        <TrashIcon className="w-5 h-5" /> מחק ארון
                                    </button>
                                    <button type="button" onClick={startEditing} className="flex-1 sm:flex-none bg-blue-100 text-blue-700 hover:bg-blue-200 font-bold py-2.5 px-4 rounded-lg flex items-center justify-center gap-1.5 transition-colors shadow-sm">
                                        <EditIcon className="w-5 h-5" /> ערוך ארון
                                    </button>
                                </div>
                                <button type="button" className="bg-white w-full sm:w-auto py-3 sm:py-2.5 px-8 border border-gray-300 rounded-lg shadow-sm text-sm font-black text-gray-800 hover:bg-gray-50 transition-colors order-1 sm:order-2" onClick={() => setSelectedCabinetId(null)}>
                                    סגור חלון
                                </button>
                            </>
                        )}
                      </div>

                    </div>
                  </div>
                </div>
              )}

            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
